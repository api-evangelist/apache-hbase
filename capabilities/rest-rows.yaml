naftiko: 1.0.0-alpha2
info:
  label: Apache HBase REST API — Rows
  description: 'Apache HBase REST API — Rows. 4 operations. Lead operation: Apache HBase Get Row. Self-contained Naftiko capability
    covering one Apache Hbase business surface.'
  tags:
  - Apache Hbase
  - Rows
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_HBASE_API_KEY: APACHE_HBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-rows
    baseUri: http://localhost:8080
    description: Apache HBase REST API — Rows business capability. Self-contained, no shared references.
    resources:
    - name: tableName-rowKey
      path: /{tableName}/{rowKey}
      operations:
      - name: getrow
        method: GET
        description: Apache HBase Get Row
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tableName
          in: path
          type: string
          required: true
        - name: rowKey
          in: path
          type: string
          description: URL-encoded row key
          required: true
      - name: putrow
        method: PUT
        description: Apache HBase Put Row
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tableName
          in: path
          type: string
          required: true
        - name: rowKey
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleterow
        method: DELETE
        description: Apache HBase Delete Row
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tableName
          in: path
          type: string
          required: true
        - name: rowKey
          in: path
          type: string
          required: true
    - name: tableName-rowKey-column
      path: /{tableName}/{rowKey}/{column}
      operations:
      - name: getcell
        method: GET
        description: Apache HBase Get Cell
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tableName
          in: path
          type: string
          required: true
        - name: rowKey
          in: path
          type: string
          required: true
        - name: column
          in: path
          type: string
          description: Column in family:qualifier format (URL-encoded)
          required: true
  exposes:
  - type: rest
    namespace: rest-rows-rest
    port: 8080
    description: REST adapter for Apache HBase REST API — Rows. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/{tablename}/{rowkey}
      name: tablename-rowkey
      description: REST surface for tableName-rowKey.
      operations:
      - method: GET
        name: getrow
        description: Apache HBase Get Row
        call: rest-rows.getrow
        with:
          tableName: rest.tableName
          rowKey: rest.rowKey
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putrow
        description: Apache HBase Put Row
        call: rest-rows.putrow
        with:
          tableName: rest.tableName
          rowKey: rest.rowKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleterow
        description: Apache HBase Delete Row
        call: rest-rows.deleterow
        with:
          tableName: rest.tableName
          rowKey: rest.rowKey
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{tablename}/{rowkey}/{column}
      name: tablename-rowkey-column
      description: REST surface for tableName-rowKey-column.
      operations:
      - method: GET
        name: getcell
        description: Apache HBase Get Cell
        call: rest-rows.getcell
        with:
          tableName: rest.tableName
          rowKey: rest.rowKey
          column: rest.column
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-rows-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache HBase REST API — Rows. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: apache-hbase-get-row
      description: Apache HBase Get Row
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-rows.getrow
      with:
        tableName: tools.tableName
        rowKey: tools.rowKey
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-hbase-put-row
      description: Apache HBase Put Row
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rest-rows.putrow
      with:
        tableName: tools.tableName
        rowKey: tools.rowKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-hbase-delete-row
      description: Apache HBase Delete Row
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: rest-rows.deleterow
      with:
        tableName: tools.tableName
        rowKey: tools.rowKey
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-hbase-get-cell
      description: Apache HBase Get Cell
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-rows.getcell
      with:
        tableName: tools.tableName
        rowKey: tools.rowKey
        column: tools.column
      outputParameters:
      - type: object
        mapping: $.
