aid: apache-hbase
name: Apache HBase
description: >-
  Apache HBase is an open-source, distributed, versioned, non-relational database modeled after Google's Bigtable. It
  provides random, real-time read/write access to big data and runs on top of Apache Hadoop HDFS, offering a REST API
  (Stargate), Thrift API, and Java client API for table and cell-level operations.
